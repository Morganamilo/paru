name: Build Release
on:
  push:
    tags:
      - v*
    branches:
      - test-release/*

permissions:
  contents: read

jobs:
  build-releases:
    name: Build ${{ matrix.platform.arch }} release
    runs-on: ubuntu-latest
    env:
      RELEASE_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || 'test' }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - docker: amd64
            arch: x86_64
          - docker: arm64/v8
            arch: aarch64
          - docker: arm/v7
            arch: armv7h

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: all
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          version: latest
      - name: Build archive
        env:
          RELEASE_ARCH: ${{ matrix.platform.arch }}
        run: |
          docker buildx build --platform=linux/${{ matrix.platform.docker }} -o . .
          mv paru.tar.zst "paru-$RELEASE_VERSION-$RELEASE_ARCH.tar.zst"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: paru-${{ matrix.platform.arch }}
          path: paru-${{ env.RELEASE_VERSION }}-${{ matrix.platform.arch }}.tar.zst
          if-no-files-found: error
          compression-level: 0
          overwrite: true

  release:
    name: Prepare draft release
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    needs: build-releases
    permissions:
      contents: write
    concurrency: release-${{ github.ref }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: paru-*
          path: artifacts
          merge-multiple: true
      - name: Create or resume draft
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          assets=(
            "artifacts/paru-$RELEASE_TAG-x86_64.tar.zst"
            "artifacts/paru-$RELEASE_TAG-aarch64.tar.zst"
            "artifacts/paru-$RELEASE_TAG-armv7h.tar.zst"
          )
          for asset in "${assets[@]}"; do test -s "$asset"; done

          gh api --paginate --slurp \
            'repos/{owner}/{repo}/releases?per_page=100' > releases.json
          jq --arg tag "$RELEASE_TAG" '
            [.[][] | select(.tag_name == $tag)] |
            if length > 1 then error("multiple releases match this tag")
            else .[0] end
          ' releases.json > release.json

          if jq -e '. == null' release.json > /dev/null; then
            gh api --header 'Accept: application/vnd.github.raw+json' \
              "repos/{owner}/{repo}/contents/CHANGELOG.md?ref=$GITHUB_SHA" > changelog.md
            awk '
              /^## / {
                if (found) exit
                found = $2 == "Paru" && $3 == ENVIRON["RELEASE_TAG"]
                if (found) print "# Changelog\n"
              }
              found {
                print
                if ($1 != "##" && NF) content = 1
              }
              END { if (!found || !content) exit 1 }
            ' changelog.md > release-notes.md
            gh release create "$RELEASE_TAG" "${assets[@]}" \
              --verify-tag --draft --title "Paru $RELEASE_TAG" --notes-file release-notes.md
          else
            jq -e 'if .draft == true then true
              else error("refusing to modify a published release") end' \
              release.json > /dev/null
            gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber
          fi
