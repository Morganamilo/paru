name: Paru

on:
  push:
    paths:
      - '.github/workflows/paru.yml'
      - 'src/*.rs'
      - 'testdata/**'
      - 'tests/**'
      - 'Cargo.*'
  pull_request:
    paths:
      - '.github/workflows/paru.yml'
      - 'src/*.rs'
      - 'testdata/**'
      - 'tests/**'
      - 'Cargo.*'

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    container:
      image: archlinux
    steps:
      - name: Install Packages
        run: pacman -Syu rust clang gcc git libarchive pkgconf sudo fakeroot --noconfirm --needed

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Format
        run: cargo fmt -- --check

      - name: Build
        run: cargo build --locked --features generate

      - name: Test
        run: |
          install -d -o nobody target/tmp testdata/pkg
          sudo -u nobody TMPDIR="$PWD/target/tmp" XDG_STATE_HOME=/tmp CARGO_HOME=/tmp/cargo cargo test --locked --features generate,mock --target-dir=/tmp -- --nocapture
          sudo -u nobody TMPDIR="$PWD/target/tmp" XDG_STATE_HOME=/tmp CARGO_HOME=/tmp/cargo cargo test --locked --features generate --test startup --target-dir=/tmp -- --nocapture

  test-git:
    runs-on: ubuntu-latest
    container:
      image: archlinux
    steps:
      - name: Install Packages
        run: pacman -Syu rust curl clang git base-devel libarchive meson asciidoc doxygen fakechroot pkgconf --noconfirm --needed

      - name: Install Pacman-git
        run: |
          git clone https://aur.archlinux.org/pacman-git
          chown -R nobody pacman-git
          cd pacman-git
          sudo -u nobody makepkg --nocheck
          sudo -u nobody makepkg --packagelist > list
          yes | pacman -U $(cat list)

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Format
        run: cargo fmt -- --check

      - name: Build
        run: cargo build --locked --features git,generate

      - name: Test
        run: |
          install -d -o nobody target/tmp testdata/pkg
          sudo -u nobody TMPDIR="$PWD/target/tmp" XDG_STATE_HOME=/tmp CARGO_HOME=/tmp/cargo cargo test --locked --features git,generate,mock --target-dir=/tmp -- --nocapture
          sudo -u nobody TMPDIR="$PWD/target/tmp" XDG_STATE_HOME=/tmp CARGO_HOME=/tmp/cargo cargo test --locked --features git,generate --test startup --target-dir=/tmp -- --nocapture

  msrv:
    runs-on: ubuntu-latest
    container:
      image: archlinux
    steps:
      - name: Install Packages
        run: pacman -Syu rustup clang gcc git pkgconf --noconfirm --needed

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check MSRV
        run: |
          msrv=$(sed -n 's/^rust-version = "\(.*\)"$/\1/p' Cargo.toml)
          rustup toolchain install "$msrv" --profile minimal
          rustup run "$msrv" cargo check --locked --all-targets --features generate
